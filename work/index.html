<!doctype html>
<html lang="en-GB" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search and sharing tags are added at build time from src/seo.ts -->
    <title>Our Work: Website Designs for Businesses | Upscaled</title>
    <meta name="theme-color" content="#0E0E0C" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function (root) {
        root.classList.add("js");
        // If the app hasn't started after 4s, show everything without the scroll reveals.
        setTimeout(function () { if (!root.classList.contains("ready")) root.classList.remove("js"); }, 4000);
        var render = function () { root.classList.add("rendered"); };
        if (location.hash) render();
        else ["scroll", "wheel", "touchstart", "pointerdown", "keydown", "focusin", "click"].forEach(function (type) {
          addEventListener(type, render, { once: true, passive: true, capture: true });
        });
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/work-main.tsx"></script>
  </body>
</html>
